name: Stateless EOD Data Collector

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run regardless of weekends or holidays'
        type: boolean
        default: false
        required: false
      allow_stale:
        description: 'Continue when TFEX has not published the expected trade_date yet (21:00 and 01:00 ICT ticks)'
        type: boolean
        default: false
        required: false

jobs:
  collect-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EOD Data Collector
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          # 14:00-18:00 UTC == 21:00-02:00 ICT: TFEX publishes in stages (investor
          # types for T land hours before the settlement/series stats), so the
          # 21:00 and 01:00 ICT ticks regularly still see yesterday's settlement.
          # They accept the lag and write whatever TFEX has published; the 06:15
          # ICT tick (23:00 UTC) stays strict and is the real gate.
          UTC_HOUR=$(date -u +%H)
          if [ "$UTC_HOUR" -ge 14 ] && [ "$UTC_HOUR" -le 18 ]; then
            ARGS="$ARGS --allow-stale"
            echo "[RUNNER] warm-up tick (${UTC_HOUR}:00 UTC) -> allow-stale enabled"
          fi
          if [ "${{ github.event.inputs.allow_stale }}" = "true" ]; then
            ARGS="$ARGS --allow-stale"
          fi
          echo "running: python eod_collector.py $ARGS"
          python eod_collector.py $ARGS

      - name: Report runner failure to Telegram
        # The job's own code sends its own failure message when it gets that far. This
        # step catches what it cannot: a timeout, a cancelled run, or a crash before
        # the entry point (a failed install, an OOM kill). Uses curl only.
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "[RUNNER] no Telegram credentials; skipping runner-failure notice"
            exit 0
          fi
          TEXT="🚨 ${WORKFLOW_NAME}
          runner ปิดงานแบบไม่ปกติ: ${RUN_STATUS}
          สาเหตุที่เป็นไปได้: timeout / ถูกยกเลิก / process ตายก่อนถึง entry point
          (ถ้าได้รับแจ้งเตือนจากตัวแอปไปแล้ว ข้อความนี้คือ fallback ของ runner)
          ${RUN_URL}"
          echo "[RUNNER] sending runner-failure notice (status=${RUN_STATUS})"
          # -f so an HTTP 4xx counts as a failure; the file is a Telegram error
          # envelope (no token) and only its success/failure is logged.
          if curl -fsS --max-time 15 -o /tmp/tg_runner_failure.json \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
               --data-urlencode "text=${TEXT}"; then
            echo "[RUNNER] runner-failure notice delivered"
          else
            echo "[RUNNER] runner-failure notice not delivered (non-fatal)"
          fi
