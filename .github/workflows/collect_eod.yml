name: Stateless EOD Data Collector

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run regardless of weekends or holidays'
        type: boolean
        default: false
        required: false
      allow_stale:
        description: 'Continue when TFEX has not published the expected trade_date yet (21:00 ICT warm-up tick)'
        type: boolean
        default: false
        required: false

jobs:
  collect-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EOD Data Collector
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          # 14:00-16:00 UTC == 21:00-23:00 ICT: TFEX has not published that day's
          # settlement yet (measured), so this warm-up tick accepts the lag
          # instead of failing the run with exit 3.
          UTC_HOUR=$(date -u +%H)
          if [ "$UTC_HOUR" -ge 14 ] && [ "$UTC_HOUR" -le 16 ]; then
            ARGS="$ARGS --allow-stale"
            echo "[RUNNER] warm-up tick (${UTC_HOUR}:00 UTC) -> allow-stale enabled"
          fi
          if [ "${{ github.event.inputs.allow_stale }}" = "true" ]; then
            ARGS="$ARGS --allow-stale"
          fi
          echo "running: python eod_collector.py $ARGS"
          python eod_collector.py $ARGS
